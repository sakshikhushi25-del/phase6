<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Feedback Form</h1>
        <p class="subtitle">We would love to hear your thoughts!</p>
        <a href="all-feedback.html" id="feedbackPage">View All Feedback</a>
        <form id="feedbackForm">
            <div class="form-group">
                <label for="name">Name : </label>
                <input type="text" placeholder="Enter your name" id="name" required>
            </div>
            <div class="form-group">
                <label for="rating">Rating : </label>
                <input type="number" placeholder="Give rating" id="rating" min="1" max="5" required>
            </div>
            <div class="form-group">
                <label for="comment">Comments : </label>
                <textarea name="comment" id="comment" placeholder="Message" required></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
